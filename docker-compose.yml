version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-flux_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flux_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flux_user} -d ${POSTGRES_DB:-flux_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flux-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-flux_redis_secure_pass_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - flux_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-flux_redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flux_postgres_data:
    driver: local
  flux_redis_data:
    driver: local
