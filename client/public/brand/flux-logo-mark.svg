<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Glow & Gradient -->
    <radialGradient id="flux-bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Ribbon: Sky to Indigo -->
    <linearGradient id="flux-top-stream" x1="15%" y1="15%" x2="95%" y2="40%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Mid Ribbon: Indigo to Emerald -->
    <linearGradient id="flux-mid-stream" x1="20%" y1="50%" x2="90%" y2="65%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Stem Curve: Emerald to Sky -->
    <linearGradient id="flux-stem-stream" x1="20%" y1="15%" x2="35%" y2="95%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="flux-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>

    <filter id="flux-inner-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="#0B0F19" />
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#flux-bg-glow)" />

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Main "F" Ribbon Group with Shadow -->
  <g filter="url(#flux-shadow)">
    <!-- Vertical Backbone Wave -->
    <path
      d="M32 26 C32 22.686 34.686 20 38 20 H48 C51.314 20 54 22.686 54 26 V88 C54 94.627 48.627 100 42 100 C36.477 100 32 95.523 32 90 Z"
      fill="url(#flux-stem-stream)"
    />

    <!-- Top Dynamic Arm (Velocity Stream) -->
    <path
      d="M44 20 H86 C93.732 20 100 26.268 100 34 C100 40.627 94.627 46 88 46 H54 V30 C54 24.477 49.523 20 44 20 Z"
      fill="url(#flux-top-stream)"
    />
    <!-- Top Stream Specular Light Edge -->
    <path
      d="M52 22 H86 C92.627 22 98 27.373 98 34 C98 35 97.8 36 97.4 37 C95 28 88 23 80 23 H52 Z"
      fill="#ffffff"
      opacity="0.4"
    />

    <!-- Middle Dynamic Arm (Liquidity & Growth Stream) -->
    <path
      d="M48 50 H76 C81.523 50 86 54.477 86 60 C86 65.523 81.523 70 76 70 H54 V56 C54 52.686 51.314 50 48 50 Z"
      fill="url(#flux-mid-stream)"
    />

    <!-- Kinetic Energy Accent Dots (Flow dynamics) -->
    <circle cx="86" cy="34" r="3.5" fill="#ffffff" opacity="0.9" />
    <circle cx="76" cy="60" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="42" cy="91" r="2.5" fill="#34D399" opacity="0.9" />
  </g>
</svg>
