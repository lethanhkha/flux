  />

  <!-- Crisp Highlights & Light Dots -->
  <circle cx="47" cy="18" r="2" fill="#ffffff" />
  <circle cx="41" cy="34" r="1.8" fill="#ffffff" />
  <circle cx="23" cy="50" r="1.6" fill="#34D399" />
